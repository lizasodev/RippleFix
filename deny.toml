# cargo-deny policy: vulnerabilities, licenses, dependency sources, bans.
# Run locally with `cargo deny check`. Enforced in CI.

[graph]
all-features = true

[advisories]
# RustSec database. Any known vulnerability or unmaintained/unsound crate fails the build.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with distributing RippleFix under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
